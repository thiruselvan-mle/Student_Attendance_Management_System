<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Department</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/add_department.css') }}">
    
</head>
<body>

<div class="page-container">

    <!-- HEADER CARD -->
    <div class="header-card">
        <h2>Add Department</h2>
        <p>Create a new department</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- FORM CARD -->
    <div class="form-card">
        <form method="POST" action="{{ url_for('admin.add_department')}}">

            <div class="form-group">
                <label>Department Name</label>
                <input type="text" name="department_name" placeholder="Enter department name" required>
            </div>

            <div class="form-group">
                <label>Department Code</label>
                <input type="text" name="department_code" placeholder="Enter department code" required>
            </div>

            <div class="button-group">
                <button type="submit" class="btn submit-btn">Submit</button>
                <a href="{{ url_for('admin.department_management') }}" class="btn back-btn">Back</a>
            </div>

        </form>
    </div>

</div>
    <script>
        setTimeout(() => {
            const alertBox = document.querySelector(".alert");
            if (alertBox) alertBox.style.display = "none";
        }, 3000);
    </script>
</body>
</html>
