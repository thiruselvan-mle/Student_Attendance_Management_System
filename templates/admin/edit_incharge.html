    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Edit Incharge</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#ffffff">
        <link rel="stylesheet" href="{{ url_for ('static', filename ='hod/edit_teacher.css')}}">
    </head>
    <body>

    <div class="layout">

        <main class="content">

            <!-- HEADER -->
            <div class="header">
                <h2>Edit Incharge</h2>
                <p>Update Incharge details</p>
            </div>

            <!-- FORM CARD -->
            <div class="form-card">
                <form method="POST">
                    <input type="hidden" name="action" value="update">
                    <div class="form-grid">

                        <!-- Teacher ID (readonly) -->
                        <div class="form-group">
                            <label>Incharge ID</label>
                            <input type="text" name="incharge_id" value="{{incharge_id.upper()}}" readonly>
                        </div>

                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="name" value="{{name.upper()}}">
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" value="{{email}}" required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" name="phone" value="{{phone}}" required>
                        </div>

                        <div class="form-group">
                            <label>Department</label>
                            <select name="department">
                                <option value="{{department}}">{{department.upper()}}</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Gender</label>
                            <select name="gender">
                                <option value="male" {% if gender == 'male' %}selected{% endif %} >Male</option>
                                <option value="female" {% if gender == 'female' %}selected{% endif %} >Female</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Experience</label>
                            <input type="number" name="experience" min="1" step="1" value="{{experience}}" required>
                        </div>

                        <div class="form-group">
                            <label>Reset Password</label>
                            <input type="password" name="password" value="{{password}}">
                        </div>

                        <div class="form-group">
                            <label>Year(Class)</label>
                            <input type="number" name="year" min="1" step="1" value="{{year}}" required>
                        </div>

                        <div class="form-group">
                            <label>Semester(Class)</label>
                            <input type="number" name="semester" min="1" step="1" value="{{semester}}" required>
                        </div>

                        <div class="form-group">
                            <label>Incharge Year(1 or >1)</label>
                            <input type="number" name="incharge_year" min="1" max="4" step="1" value="{{incharge_year}}" required>
                        </div>

                    </div>

                    <!-- BUTTONS -->
                    <div class="btn-group">
                        <button type="submit" class="btn primary">Update</button>
                        <a href="{{ url_for('admin.incharge_management') }}" class="btn secondary">Cancel</a>
                    </div>

                </form>
            </div>

        </main>

    </div>

    </body>
    </html>
